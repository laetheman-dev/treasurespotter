name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom 1.18.0-alpha.20's Gradle plugin itself requires a JVM
      # runtime of at least Java 25 to run (this is unrelated to the mod's
      # own bytecode target, which is pinned to Java 21 in build.gradle via
      # `options.release = 21`, matching what Minecraft 1.21.11 requires).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # This repo does not ship a Gradle wrapper jar, so a real Gradle
      # distribution is provisioned here instead. Fabric Loom 1.18.0-alpha.20
      # requires Gradle's plugin API version 9.7.0+, hence 9.7.1 here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: treasurespotter-jar
          path: build/libs/*.jar

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
